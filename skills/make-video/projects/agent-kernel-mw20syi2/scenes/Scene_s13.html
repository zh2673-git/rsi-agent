<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #efe9dd; height: 100%; overflow: hidden; }
  [data-scene-id] { position: relative; width: 100%; height: 100%; }
  .stage { position: absolute; inset: 0; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .subject { position: absolute; left: 50%; top: 50%; width: 1px; height: 1px; opacity: 0; }

  /* 亮调渲染层：纸底 + 墨阶需要更高的局部对比，否则一层白糊掉结构 */
  .stage canvas { filter: contrast(1.16) saturate(1.06) brightness(0.985); }
  .stage::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 46%, rgba(255,255,255,0.05) 0%, rgba(120,104,80,0.10) 100%),
      repeating-linear-gradient(0deg, rgba(86,72,50,0.022) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply; }
  html, body { background: #efe9dd; }
</style>
</head>
<body data-scene-id="s13">
<div data-scene-id="s13" data-beats="6">
  <div class="stage"><canvas width="1920" height="1080"></canvas></div>
  <div class="subject"></div>
</div>
<script src="../motion/gsap.min.js"></script>
<script src="../motion/motion-lib.js"></script>
<script src="../canvas/ck-lib.js"></script>
<script src="../canvas/ck-programs.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  MV.use('scene-s13');
  var tl = MV.timeline();
  var cv = document.querySelector('canvas');
  var ctx = cv.getContext('2d');
  var prog = window.CK_PROGRAMS['s13'];
  if (!prog) return;
  var S = prog.setup(9173);
  var D = window.__shotDurationS || 5.0;
  // 时间线长度 = 镜长：画面是时间的纯函数，渲染器逐帧 seek 可复现
  tl.to({ v: 0 }, { v: 1, duration: D, ease: 'none' }, 0);
  tl.eventCallback('onUpdate', function () { prog.draw(ctx, tl.time(), D, S); });
  prog.draw(ctx, 0, D, S);
  // 长镜禁死寂：画布微脉冲（有界 repeat，时间线必须有限）
  tl.to(cv, { scale: 1.012, duration: 0.9, ease: 'sine.inOut', yoyo: true, repeat: 3, transformOrigin: '50% 48%' }, D * 0.42);
});
</script>
</body>
</html>
