<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  [data-scene-id] { position: relative; width: 100%; height: 100%; }
  body { font-family: 'Microsoft YaHei','PingFang SC',sans-serif; background: #f6f1e6; color: #1f1b16; }
  .stage {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center;
    padding: 9% 10%; box-sizing: border-box;
    background:
      radial-gradient(ellipse at 78% 16%, #e8a33d1f 0%, transparent 58%),
      linear-gradient(168deg, #f6f1e6 0%, #e9e1d1 100%);
  }
  .grain-field {
    position: absolute; inset: -6%; opacity: 0.45; pointer-events: none;
    background-image:
      repeating-linear-gradient(0deg, #8d827216 0 1px, transparent 1px 4.2vmin),
      repeating-linear-gradient(90deg, #8d827216 0 1px, transparent 1px 4.2vmin);
  }
  .subject {
    position: relative; z-index: 3;
    font-size: 128px; font-weight: 800; line-height: 1.06;
    letter-spacing: -0.03em; color: #1f1b16; max-width: 92%;
  }
  .subject em {
    font-style: normal; color: #0f7b96;
    position: relative; display: inline-block; isolation: isolate;
  }
  .subject em .hl {
    position: absolute; left: -0.06em; right: -0.06em; bottom: 0.06em; height: 0.34em;
    background: #e8a33d; opacity: 0.4; z-index: -1;
    transform-origin: 0 50%; display: block; border-radius: 2px;
  }
  .figure {
    position: absolute; right: 10%; bottom: 15%; z-index: 3;
    font-size: 92px; font-weight: 800; color: #0f7b96;
    font-variant-numeric: tabular-nums; letter-spacing: -0.04em;
  }
  .kicker {
    position: relative; z-index: 3; font-size: 30px; font-weight: 600;
    letter-spacing: 0.26em; text-transform: uppercase;
    color: #5b5245; margin-bottom: 2.2vmin;
  }
  .hint {
    position: relative; z-index: 3; margin-top: 3.4vmin;
    font-size: 34px; line-height: 1.6; color: #5b5245;
    max-width: 78%; opacity: 0.68;
  }
  .rule-line {
    position: absolute; left: 10%; top: 21%; width: 3px; height: 23%; z-index: 2;
    background: linear-gradient(180deg, #0f7b96, transparent);
    transform-origin: 50% 0;
  }
  .band { position: absolute; left: 0; right: 0; height: 33.4%; opacity: 0; pointer-events: none; }
  .band.b1 { top: 0; background: #0f7b96; }
  .band.b2 { top: 33.3%; background: #e8a33d; }
  .band.b3 { top: 66.6%; background: #0f7b96; }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.05; mix-blend-mode: multiply;
    background-image: repeating-radial-gradient(circle at 30% 40%, rgba(90,74,50,0.14) 0 0.5px, transparent 0.6px 2.2px);
    background-size: 3px 3px; }
  /* 环境光晕：大面积径向渐变（覆盖约半个画面），是母题运动的载体。
     为什么不用 .grain-field：那是 1px/16% 透明度的网格，动多少都不改变亮度，
     实测做成片帧间差仅 0.2/255 —— 等于没动。运动的载体必须有视觉权重。 */
  .halo {
    position: absolute; inset: -20%; pointer-events: none; z-index: 0;
    background: radial-gradient(circle at 30% 38%, #0f7b9699 0%, #e8a33d66 38%, transparent 72%);
    opacity: 0.85;
  }
  .vignette { position: absolute; inset: 0; pointer-events: none; opacity: 0.2;
    background: radial-gradient(ellipse at center, transparent 54%, rgba(58,44,24,0.4) 132%); }
</style>
</head>
<body data-scene-id="s01">
<div data-scene-id="s01" data-beats="5" data-accent="1">
  <div class="stage">
    <div class="grain-field" data-motif></div>
    <div class="halo" data-halo></div>
    <div class="rule-line" data-rule></div>
    <div class="kicker" data-rank="tertiary">MOTION GRAMMAR</div>
    <div class="subject" data-rank="primary"><em>对上<span class="hl"></span></em></div>
    <div class="figure">01</div>
    <div class="hint" data-rank="secondary">不是给每句话配一张图</div>
    <div class="band b1"></div><div class="band b2"></div><div class="band b3"></div>
  </div>
  <div class="grain"></div>
  <div class="vignette"></div>
</div>
<script src="../motion/gsap.min.js"></script>
<script src="../motion/motion-lib.js"></script>
<script>
(function () {
  function boot() {
    MV.use('scene-s01');
    if (!MV.timeline()) return;
    var accentEl = document.querySelector('[data-accent]');
    var accent = accentEl ? accentEl.getAttribute('data-accent') === '1' : false;

    if (accent) {
      MV.slam('.subject', { delay: 60 });
      MV.highlight('.subject em .hl', { delay: 300 });
    } else {
      MV.enter('.subject', { easing: 'power3.out', duration: 600, from: { opacity: 0, y: 52 } });
      MV.highlight('.subject em .hl', { delay: 360 });
    }
    MV.staggeredIn('.kicker, .hint', { delay: 120, secondary: 180, tertiary: 320 });
    MV.counter('.figure', { from: 0, to: 1, decimals: 0, suffix: '', delay: 420 });
    MV.maskReveal('.rule-line', { dir: 'down', duration: 500, delay: 200 });
    // 母题必须是可见运动：grain-field 是网格纹理，用 scan 横向掠过（走 x 不走 y）。
    // 原来写 amp: 0.3 —— float 只有 ±1.8px、shimmer 根本不吃 amp，两种都等于静止。
    // 一个元素只挂一条母题循环：breathe 与 drift 都写 transform，
    // 同元素并发两条补间会互相覆盖，实际只剩一条生效（且相位被打乱）。
    MV.motifLoop('.halo', { kind: 'breathe', amp: 1.0, duration: 1600, span: 16 });
    MV.motifLoop('.rule-line', { kind: 'pulse', amp: 0.6, span: 14 });
    MV.enter('.figure', { easing: 'power2.out', duration: 600, delay: 300, from: { opacity: 0 } });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
